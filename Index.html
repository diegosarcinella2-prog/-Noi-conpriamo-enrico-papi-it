<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enrico Papi All'Infinito</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #16002c 0%, #3e0b5a 50%, #000000 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            z-index: 5;
        }
        h1 {
            color: #ffffff;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 40px;
            line-height: 1.2;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-papi {
            width: 100%;
            background: linear-gradient(90deg, #ff0055 0%, #ff5500 50%, #ffaa00 100%);
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            padding: 25px 20px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 0, 85, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.3;
            transition: transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-papi:active {
            transform: scale(0.96);
        }
        .video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 10;
            display: none;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container" id="mainInterface">
        <h1>cosa vorrà mai Enrico papi?</h1>
        <button class="btn-papi" id="playBtn">ATTIVA ENRICO PAPI<br>ALL'INFINITO 🚀</button>
    </div>

    <div class="video-wrapper" id="videoContainer">
        <video id="papiVideo" loop playsinline webkit-playsinline muted>
            <source src="papi" type="video/mp4">
            <source src="papi.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const mainInterface = document.getElementById('mainInterface');
        const videoContainer = document.getElementById('videoContainer');
        const papiVideo = document.getElementById('papiVideo');

        playBtn.addEventListener('click', () => {
            mainInterface.style.display = 'none';
            videoContainer.style.display = 'block';
            
            papiVideo.muted = false;
            papiVideo.volume = 1.0;
            
            const playPromise = papiVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    papiVideo.muted = true;
                    papiVideo.play().then(() => {
                        setTimeout(() => { papiVideo.muted = false; }, 50);
                    });
                });
            }

            if (videoContainer.requestFullscreen) {
                videoContainer.requestFullscreen().catch(() => {});
            } else if (videoContainer.webkitRequestFullscreen) {
                videoContainer.webkitRequestFullscreen().catch(() => {});
            } else if (papiVideo.webkitEnterFullscreen) {
                papiVideo.webkitEnterFullscreen();
            }
        });
    </script>
</body>
</html>
